    <style>
        .painel-rotas {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            width: 380px;
            max-height: 88vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.25);
            padding: 14px;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .painel-rotas h1 {
            font-size: 18px;
            line-height: 1.2;
            margin: 0 0 8px 0;
        }

        .painel-rotas h2 {
            font-size: 14px;
            margin: 14px 0 6px 0;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .kpi {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 8px;
        }

        .kpi b {
            display: block;
            font-size: 11px;
            color: #555;
        }

        .kpi span {
            font-size: 15px;
            font-weight: bold;
            color: #111;
        }

        .rota-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            background: #fafafa;
        }

        .rota-card button {
            border: none;
            background: #111827;
            color: white;
            border-radius: 8px;
            padding: 6px 8px;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
        }

        .rota-card button:hover {
            background: #374151;
        }

        .busca {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 6px 0 10px 0;
            box-sizing: border-box;
        }

        .cliente-lista {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 6px;
            background: #fff;
        }

        .cliente-item {
            padding: 6px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .cliente-item:hover {
            background: #f0f0f0;
        }

        .cliente-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 800px) {
            .painel-rotas {
                left: 8px;
                right: 8px;
                top: auto;
                bottom: 8px;
                width: auto;
                max-height: 45vh;
            }
        }
    </style>

        function formatarNumero(valor, casas=0) {
            return Number(valor).toLocaleString("pt-BR", {
                minimumFractionDigits: casas,
                maximumFractionDigits: casas
            });
        }

        function carregarResumoRotas() {
            const box = document.getElementById("resumoRotas");
            let html = "";

            ROTAS_DADOS.forEach(r => {
                html += `
                    <div class="rota-card">
                        <b>Rota ${r.Rota} - ${r.Placa_Principal}</b><br>
                        <span>Reservas: ${r.Placas_Reserva && r.Placas_Reserva.length ? r.Placas_Reserva.join(", ") : "Sem reserva compatível"}</span><br>
                        <span>Entregas: ${r.Qtd_Entregas}</span><br>
                        <span>Peso: ${formatarNumero(r.Peso_Total, 0)} kg</span><br>
                        <span>Capacidade: ${formatarNumero(r.Capacidade_Kg, 0)} kg</span><br>
                        <span>Ocupação: ${(r.Ocupacao * 100).toFixed(1)}%</span><br>
                        <span>Raio: ${r.Raio_Km.toFixed(1)} km</span><br>
                        <span>Distância aprox.: ${r.Distancia_Aprox_Km.toFixed(1)} km</span>
                        <button onclick="focarRota(${r.Centroide_Lat}, ${r.Centroide_Lon}, ${r.Raio_Km})">Focar rota</button>
                    </div>
                `;
            });

            box.innerHTML = html;
        }

        function todosClientes() {
            let clientes = [];
            ROTAS_DADOS.forEach(r => {
                r.Clientes.forEach((c, idx) => {
                    clientes.push({
                        rota: r.Rota,
                        placa: r.Placa_Principal,
                        ordem: idx + 1,
                        nome: c.Nome_Fantasia,
                        codigo: c.Codigo_Cliente,
                        peso: c.Peso,
                        caixas: c.Caixas_Corrigidas,
                        lat: c.Latitude,
                        lon: c.Longitude,
                        qtdEntregasRota: r.Qtd_Entregas,
                        pesoRota: r.Peso_Total,
                        raio: r.Raio_Km
                    });
                });
            });
            return clientes;
        }

        function filtrarClientes() {
            const termo = document.getElementById("buscaCliente").value.toLowerCase().trim();
            const lista = document.getElementById("listaClientes");

            const clientes = todosClientes().filter(c =>
                String(c.nome).toLowerCase().includes(termo) ||
                String(c.codigo).toLowerCase().includes(termo)
            ).slice(0, 60);

            let html = "";

            clientes.forEach(c => {
                html += `
                    <div class="cliente-item" onclick="focarCliente(${c.lat}, ${c.lon})">
                        <b>${c.nome}</b><br>
                        Código: ${c.codigo} | Rota ${c.rota} | Ordem ${c.ordem}<br>
                        Peso: ${formatarNumero(c.peso, 1)} kg | Cx: ${formatarNumero(c.caixas, 1)}<br>
                        Carro: ${c.placa} | Entregas na rota: ${c.qtdEntregasRota} | Raio: ${c.raio.toFixed(1)} km
                    </div>
                `;
            });

            lista.innerHTML = html || "<div style='padding:8px;color:#777;'>Nenhum cliente encontrado.</div>";
        }

        function focarCliente(lat, lon) {
            map.setView([lat, lon], 15);
        }

        function focarRota(lat, lon, raioKm) {
            let zoom = 12;
            if (raioKm > 20) zoom = 10;
            if (raioKm > 40) zoom = 9;
            if (raioKm < 5) zoom = 13;
            map.setView([lat, lon], zoom);
        }

        setTimeout(() => {
            carregarResumoRotas();
            filtrarClientes();
        }, 500);
